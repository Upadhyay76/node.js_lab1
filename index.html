<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎬 Movie Catalog</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0d0d12;
  --card:#1a1a24;
  --accent:#4ef0b8;
  --text:#ffffff;
  --muted:#888;
}

*{margin:0;padding:0;box-sizing:border-box;}

body{
  font-family:Poppins, sans-serif;
  background:var(--bg);
  color:var(--text);
}

/* HEADER */
header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:20px 30px;
  background:#111;
  position:sticky;
  top:0;
}

header h1{
  color:var(--accent);
}

/* SEARCH */
.search-box{
  padding:10px 15px;
  border-radius:8px;
  border:none;
  background:#222;
  color:white;
  width:250px;
}

/* GRID */
.container{
  padding:30px;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
  gap:20px;
}

/* CARD */
.card{
  background:var(--card);
  border-radius:12px;
  overflow:hidden;
  transition:.3s;
}

.card:hover{
  transform:scale(1.03);
  box-shadow:0 10px 25px rgba(0,0,0,0.5);
}

.poster{
  width:100%;
  height:200px;
  object-fit:cover;
}

.content{
  padding:15px;
}

.title{
  font-size:1.1rem;
  font-weight:600;
}

.meta{
  font-size:0.8rem;
  color:var(--muted);
  margin:5px 0;
}

/* RATING BAR */
.rating-bar{
  height:6px;
  background:#333;
  border-radius:10px;
  margin-top:8px;
}

.rating-fill{
  height:100%;
  background:var(--accent);
  border-radius:10px;
}

/* FAB BUTTON */
#fab{
  position:fixed;
  bottom:25px;
  right:25px;
  width:60px;
  height:60px;
  border-radius:50%;
  border:none;
  background:var(--accent);
  color:black;
  font-size:30px;
  cursor:pointer;
  transition:.3s;
}

#fab:hover{
  transform:scale(1.1);
}

/* MODAL */
.modal{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.7);
  display:none;
  justify-content:center;
  align-items:center;
}

.modal-content{
  background:var(--card);
  padding:25px;
  border-radius:10px;
  width:350px;
}

.modal input{
  width:100%;
  padding:10px;
  margin:8px 0;
  border:none;
  border-radius:6px;
  background:#222;
  color:white;
}

.modal button{
  width:100%;
  padding:10px;
  margin-top:10px;
  border:none;
  border-radius:6px;
  background:var(--accent);
  color:black;
  cursor:pointer;
}

.close{
  background:#444 !important;
  color:white !important;
}

/* EMPTY */
.empty{
  text-align:center;
  margin-top:50px;
  color:var(--muted);
}
</style>
</head>

<body>

<header>
  <h1>🎬 Movie Catalog</h1>
  <input type="text" placeholder="Search..." class="search-box">
</header>

<div class="container">

  <!-- MOVIE CARD -->
  <div class="card">
    <img src="https://via.placeholder.com/300x200" class="poster">
    <div class="content">
      <div class="title">Inception</div>
      <div class="meta">Director: Nolan</div>
      <div class="meta">Year: 2010</div>

      <div class="rating-bar">
        <div class="rating-fill" style="width:85%"></div>
      </div>
    </div>
  </div>

  <div class="card">
    <img src="https://via.placeholder.com/300x200" class="poster">
    <div class="content">
      <div class="title">Avengers</div>
      <div class="meta">Director: Marvel</div>
      <div class="meta">Year: 2019</div>

      <div class="rating-bar">
        <div class="rating-fill" style="width:90%"></div>
      </div>
    </div>
  </div>

</div>

<div class="empty">
  No movies yet 🎬
</div>

<!-- FLOAT BUTTON -->
<button id="fab" onclick="openModal()">+</button>

<!-- MODAL -->
<div class="modal" id="modal">
  <div class="modal-content">
    <h3>Add Movie</h3>
    <input placeholder="Title">
    <input placeholder="Director">
    <input placeholder="Year">
    <input placeholder="Rating (0-10)">
    <button>Add Movie</button>
    <button class="close" onclick="closeModal()">Cancel</button>
  </div>
</div>

<script>
function openModal(){
  document.getElementById("modal").style.display="flex";
}
function closeModal(){
  document.getElementById("modal").style.display="none";
}
</script>

</body>
</html>
